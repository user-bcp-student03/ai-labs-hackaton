[project]
name = "wallet-api"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "httpx"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 85
